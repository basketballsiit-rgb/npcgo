name: Deploy NPC GO

# สั่งให้ทำงานทุกครั้งที่มีการ Push โค้ดมาที่เส้นทาง main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: เชื่อมต่อเซิร์ฟเวอร์และอัปเดตระบบ
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        # ด้านล่างนี้คือคำสั่งที่จะรันบนเซิร์ฟเวอร์ NPC ของเรา
        script: |
          cd /var/www/npcgo
          git pull origin main
          npm install
          npm run build
          pm2 reload all
          